[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-screener"
version = "0.1.0"
description = "Screener okazji na Vinted: fajne itemy wystawione dużo poniżej ceny retail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vinted-screener = "vinted_screener.cli:main"

[tool.setuptools]
packages = ["vinted_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
