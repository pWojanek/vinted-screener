<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okazje na Vinted</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3dd;
  --accent: #007782; --accent-soft: #e0f1f2; --good: #1a7f37; --warn: #b54708; --warn-soft: #fdf1e4; --bad: #c4320a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141413; --card: #1f1f1d; --text: #ecece8; --muted: #9a9a93; --line: #33332f;
          --accent: #3fb6c0; --accent-soft: #173a3d; --good: #4ac26b; --warn: #f0a24a; --warn-soft: #3a2a17; --bad: #ff7a59; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
header { padding-top: 20px; padding-bottom: 8px; }
h1 { margin: 0 0 4px; font-size: 24px; }
h2 { margin: 0; font-size: 17px; }
.meta, .small { color: var(--muted); font-size: 13px; }
button, select, input[type=search], input[type=text], input[type=number] {
  font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 8px 18px; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; }

/* wyszukiwarka (tylko w trybie serve) */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 8px 0 4px; }
.searchbar { display: flex; flex-wrap: wrap; gap: 8px; }
.searchbar input[type=search] { flex: 1 1 260px; min-width: 0; font-size: 17px; padding: 10px 14px; }
.searchbar .primary { padding: 10px 20px; }
.hint { margin-top: 6px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.chip { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip .x { margin-left: 6px; color: var(--muted); }
.notice { margin-top: 12px; font-size: 13px; color: var(--muted); }
.options { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 14px;
           padding-top: 12px; border-top: 1px solid var(--line); }
.options label, .controls label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.options input[type=text] { width: 130px; }
.options input[type=number] { width: 80px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 12px; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.err { color: var(--bad); margin-top: 6px; white-space: pre-line; }

/* wyniki */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
input[type=search] { min-width: 180px; }
main { display: grid; gap: 14px; padding-bottom: 40px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@media (max-width: 520px) { main { grid-template-columns: 1fr 1fr; gap: 10px; } .price { font-size: 17px; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
        display: flex; flex-direction: column; }
.card:hover { border-color: var(--accent); }
.card-main { text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.photo { aspect-ratio: 3 / 4; background: var(--line) center / cover no-repeat; position: relative; }
.badge { position: absolute; top: 8px; left: 8px; background: var(--good); color: #fff; font-weight: 700;
         padding: 3px 8px; border-radius: 999px; font-size: 14px; }
.score { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff;
         padding: 3px 8px; border-radius: 999px; font-size: 12px; }
.sus { position: absolute; bottom: 8px; left: 8px; right: 8px; background: var(--bad); color: #fff;
       font-size: 12px; padding: 3px 8px; border-radius: 6px; text-align: center; }
.body { padding: 10px 12px 0; display: flex; flex-direction: column; gap: 4px; }
.foot { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.model { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.price { font-size: 20px; font-weight: 700; }
.price s { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.src { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
       -webkit-box-orient: vertical; }
.src.est { color: var(--warn); }
.mk-good { color: var(--good); } .mk-bad { color: var(--warn); }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header class="wrap">
  <h1>Okazje na Vinted</h1>
  <div class="meta" id="meta"></div>
</header>

<section id="scanner" class="wrap" hidden>
  <div class="panel" id="panel">
    <form class="searchbar" id="search-form" autocomplete="off">
      <input type="search" id="s-input" list="s-suggest" maxlength="400" aria-label="Czego szukasz"
        placeholder="Czego szukasz? np. Nike bluza, kurtka puchowa, Carhartt WIP">
      <datalist id="s-suggest"></datalist>
      <button type="submit" class="primary" id="scan">Szukaj okazji</button>
      <button type="button" id="stop" hidden>Zatrzymaj</button>
    </form>
    <div class="small hint">Wpisz markę („Carhartt WIP”), typ rzeczy („kurtka puchowa”) albo jedno i drugie („Nike bluza”).
      Kilka fraz oddziel przecinkiem. <span id="estimate"></span></div>
    <div class="recent" id="recent"></div>
    <div class="options">
      <label title="Dotyczy fraz bez marki, np. „kurtka puchowa”: bierze tylko marki z watchlisty (Nike, The North Face, Carhartt WIP…). Odznacz, żeby brać każdą markę.">
        <input type="checkbox" id="o-known" checked> przy samym typie rzeczy tylko znane marki</label>
      <label>Rozmiary <input type="text" id="o-sizes" placeholder="np. 43 L 42,5" title="Oddziel spacją; puste = wszystkie"></label>
      <label>Min. rabat <select id="o-disc">
        <option value="40">40%</option><option value="50">50%</option>
        <option value="60">60%</option><option value="70">70%</option></select></label>
      <label id="o-shops-label"><input type="checkbox" id="o-shops" checked> ceny ze sklepów</label>
      <label id="o-ceneo-label"><input type="checkbox" id="o-ceneo" checked> ceny z Ceneo</label>
      <label><input type="checkbox" id="o-seller" checked> czytaj opisy sprzedających</label>
      <label id="o-cost-label">Limit kosztu AI <input type="number" id="o-cost" min="0" max="50" step="0.5"> USD</label>
      <label><input type="checkbox" id="o-sus"> szukaj też podejrzanie tanich</label>
    </div>
    <div class="notice" id="ai-status"></div>
    <div id="progress" hidden>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="small" id="progress-text" style="margin-top:6px"></div>
      <div class="small" id="understood"></div>
    </div>
    <div class="small err" id="scan-errors"></div>
  </div>
</section>

<div class="controls wrap">
  <input type="search" id="q" placeholder="Filtruj wyniki…" aria-label="Filtruj wyniki po tytule">
  <label>Kategoria <select id="cat"><option value="">wszystkie</option></select></label>
  <label>Produkt <select id="model"><option value="">wszystkie</option></select></label>
  <label>Min. rabat <select id="disc">
    <option value="0">dowolny</option><option value="0.5">50%</option><option value="0.6">60%</option>
    <option value="0.7">70%</option><option value="0.8">80%</option></select></label>
  <label>Źródło ceny <select id="src">
    <option value="">dowolne</option><option value="shop">ze sklepów (sklepy, Ceneo, AI)</option>
    <option value="noest">bez szacunków i median</option></select></label>
  <label>Sortuj <select id="sort">
    <option value="score">wynik</option><option value="discount">rabat</option>
    <option value="price">cena</option><option value="newest">najnowsze</option></select></label>
  <label><input type="checkbox" id="sus"> pokaż podejrzane</label>
</div>
<main id="grid" class="wrap"></main>

<script>
const BOOT = __BOOT__;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const zl = (v, cur) => v == null ? "—" : Math.round(v).toLocaleString("pl-PL") + (cur === "PLN" ? " zł" : " " + cur);
const pct = (v) => Math.round(v * 100) + "%";
const usd = (v) => "$" + (v || 0).toFixed(2);
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

// ─── wyniki (wspólne dla raportu statycznego i trybu serve) ───────────────────
let deals = [];
function age(iso) {
  if (!iso) return "";
  const min = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
  if (min < 60) return min + " min temu";
  if (min < 2880) return Math.floor(min / 60) + " h temu";
  return Math.floor(min / 1440) + " dni temu";
}
function fillSelect(sel, values) {
  const current = sel.value;
  sel.length = 1;
  [...new Set(values)].sort().forEach((v) => sel.add(new Option(v, v)));
  sel.value = [...sel.options].some((o) => o.value === current) ? current : "";
}
const sorters = {
  score: (a, b) => b.score - a.score,
  discount: (a, b) => b.retail_discount - a.retail_discount,
  price: (a, b) => a.total_price - b.total_price,
  newest: (a, b) => (b.uploaded_at || "").localeCompare(a.uploaded_at || ""),
};
const APPROX_KINDS = ["estimate", "market"];
function sourceLine(d) {
  const s = d.retail_source || { kind: "watchlist", label: "watchlista" };
  const details = [s.product && `produkt: ${s.product}`, s.checked_at && `sprawdzono ${s.checked_at}`, s.note].filter(Boolean).join(" · ");
  const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>` : esc(s.label);
  if (s.kind === "web") return `<div class="src" title="${esc(details)}">retail wg ${link}${s.note ? " · " + esc(s.note) : ""}</div>`;
  if (s.kind === "shop") return `<div class="src" title="${esc(details)}">retail wg ${link}${s.note ? " · " + esc(s.note) : ""}</div>`;
  if (s.kind === "ceneo") return `<div class="src" title="${esc(details)}">wg ${link} · najniższa cena w sklepach</div>`;
  if (s.kind === "seller") return `<div class="src" title="${esc(details)}">wg sprzedającego: ${esc(s.note)}</div>`;
  if (s.kind === "estimate") return `<div class="src est" title="${esc(details)}">⚠ retail to ${esc(s.label)}${s.note ? " — " + esc(s.note) : ""}</div>`;
  if (s.kind === "market") return `<div class="src est" title="${esc(details)}">⚠ brak ceny retail — porównanie z: ${esc(s.label)}</div>`;
  return `<div class="src" title="${esc(details)}">retail wg ${esc(s.label)}</div>`;
}
function card(d) {
  let market = "";
  if (d.market_median != null) {
    const cls = d.market_discount > 0 ? "mk-good" : "mk-bad";
    market = `<div class="small">mediana Vinted ${zl(d.market_median, d.currency)}` +
      (d.market_discount != null ? ` · <span class="${cls}">${d.market_discount > 0 ? "−" : "+"}${pct(Math.abs(d.market_discount))}</span>` : "") +
      `</div>`;
  }
  const estimated = d.retail_source && APPROX_KINDS.includes(d.retail_source.kind);
  return `<div class="card">
    <a class="card-main" href="${esc(d.url)}" target="_blank" rel="noopener">
      <div class="photo" style="background-image:url('${esc(d.photo || "")}')">
        <span class="badge">−${pct(d.retail_discount)}</span><span class="score">${d.score.toFixed(0)} pkt</span>
        ${d.suspicious ? '<span class="sus">⚠ podejrzanie tanio — sprawdź autentyczność</span>' : ""}
      </div>
      <div class="body">
        <div class="model">${esc(d.model)}</div>
        <div class="title" title="${esc(d.title)}">${esc(d.title)}</div>
        <div class="price">${zl(d.total_price, d.currency)}<s>${estimated ? "~" : ""}${zl(d.retail, d.currency)}</s></div>
      </div>
    </a>
    <div class="foot">
      ${sourceLine(d)}
      ${market}
      <div class="small">${esc(d.size || "?")} · ${esc(d.condition)} · ♥ ${d.favourites}</div>
      <div class="small">${esc(d.seller)} · ${age(d.uploaded_at)}</div>
    </div></div>`;
}
function setDeals(list, emptyText) {
  deals = list;
  fillSelect($("cat"), deals.map((d) => d.category));
  fillSelect($("model"), deals.map((d) => d.model));
  render(emptyText);
}
let lastEmptyText = "Brak okazji dla wybranych filtrów.";
function render(emptyText) {
  if (emptyText) lastEmptyText = emptyText;
  const q = $("q").value.trim().toLowerCase(), cat = $("cat").value, model = $("model").value, src = $("src").value;
  const minDisc = parseFloat($("disc").value), showSus = $("sus").checked;
  const kind = (d) => (d.retail_source || {}).kind;
  const rows = deals.filter((d) =>
    (!cat || d.category === cat) && (!model || d.model === model) && d.retail_discount >= minDisc &&
    (showSus || !d.suspicious) && (!q || (d.title + " " + d.model).toLowerCase().includes(q)) &&
    (!src || (src === "shop" ? ["web", "shop", "ceneo"].includes(kind(d)) : !APPROX_KINDS.includes(kind(d))))
  ).sort(sorters[$("sort").value]);
  $("grid").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty">${esc(lastEmptyText)}</div>`;
}
["q", "cat", "model", "disc", "src", "sort", "sus"].forEach((id) => $(id).addEventListener("input", () => render()));

// ─── raport statyczny ──────────────────────────────────────────────────────────
if (BOOT.mode === "static") {
  const m = BOOT.meta;
  $("meta").textContent = `Wygenerowano ${new Date(m.generated_at).toLocaleString("pl-PL")} · ` +
    `${BOOT.deals.length} okazji z ${m.listings_seen} przejrzanych ogłoszeń` +
    (m.errors ? ` · błędy: ${m.errors}` : "");
  setDeals(BOOT.deals);
}

// ─── tryb serve: wyszukiwarka i skan na żywo ─────────────────────────────────
if (BOOT.mode === "app") {
  $("scanner").hidden = false;
  const MAX_RECENT = 12;
  let config = null, polling = null;
  // ostatnie frazy; po aktualizacji z wersji z chipami podpowiadamy dawniej wybrane marki
  let recent = store.get("vs-recent", null) ?? [...store.get("vs-brands", []), ...store.get("vs-custom-brands", [])].slice(0, MAX_RECENT);

  async function api(path, body) {
    const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }
  const sameText = (a, b) => a.toLowerCase() === b.toLowerCase();
  function phrases() {
    const list = [];
    for (const raw of $("s-input").value.split(",")) {
      const text = raw.trim().replace(/\s+/g, " ");
      if (text && !list.some((t) => sameText(t, text))) list.push(text);
    }
    return list;
  }

  function renderRecent() {
    $("recent").innerHTML = recent.length ? `<span class="small">Ostatnio:</span>` + recent.map((t) =>
      `<button type="button" class="chip" data-text="${esc(t)}">${esc(t)}` +
      `<span class="x" data-remove="${esc(t)}" title="usuń z ostatnich">×</span></button>`).join("") : "";
  }
  function remember(list) {
    recent = [...list, ...recent.filter((t) => !list.some((x) => sameText(x, t)))].slice(0, MAX_RECENT);
    store.set("vs-recent", recent);
    renderRecent();
  }
  $("recent").addEventListener("click", (e) => {
    const remove = e.target.closest("[data-remove]");
    if (remove) {
      recent = recent.filter((t) => t !== remove.dataset.remove);
      store.set("vs-recent", recent);
      renderRecent();
      return;
    }
    const chip = e.target.closest(".chip");
    if (!chip) return;
    $("s-input").value = chip.dataset.text;
    $("s-input").focus();
    onInput();
  });

  // podpowiedzi dla frazy po ostatnim przecinku: marki, typy rzeczy, a po wpisaniu marki — „marka + typ”
  function suggest() {
    if (!config) return;
    const value = $("s-input").value, cut = value.lastIndexOf(",");
    const head = cut >= 0 ? value.slice(0, cut + 1) + " " : "";
    const last = value.slice(cut + 1).trim().toLowerCase();
    let options = [];
    if (last) {
      const brand = config.brands.find((b) => last === b.toLowerCase() || last.startsWith(b.toLowerCase() + " "));
      const pool = [...(brand ? config.types.map((t) => `${brand} ${t}`) : []), ...config.brands, ...config.types];
      const starts = pool.filter((o) => o.toLowerCase().startsWith(last));
      const contains = pool.filter((o) => !o.toLowerCase().startsWith(last) && o.toLowerCase().includes(last));
      options = [...new Set([...starts, ...contains])].filter((o) => o.toLowerCase() !== last).slice(0, 15);
    }
    $("s-suggest").innerHTML = options.map((o) => `<option value="${esc(head + o)}">`).join("");
  }
  function updateEstimate() {
    if (!config) return;
    const n = phrases().length;
    const minutes = Math.max(1, Math.round(n * config.seconds_per_search / 60));
    const word = n === 1 ? "fraza" : n % 10 >= 2 && n % 10 <= 4 && (n < 10 || n > 20) ? "frazy" : "fraz";
    $("estimate").textContent = n ? `Teraz: ${n} ${word}, ok. ${minutes} min` +
      (config.ai_enabled ? `, koszt AI najwyżej ${usd(parseFloat($("o-cost").value) || 0)}.` : ".") : "";
  }
  function onInput() { suggest(); updateEstimate(); saveOptions(); }
  $("s-input").addEventListener("input", onInput);

  const optionIds = ["o-known", "o-sizes", "o-disc", "o-cost", "o-sus", "o-shops", "o-ceneo", "o-seller"];
  function loadOptions() {
    const o = store.get("vs-options-v2", {});
    $("s-input").value = o.text ?? recent[0] ?? "";
    $("o-known").checked = o.known ?? true;
    $("o-sizes").value = o.sizes ?? "";
    $("o-disc").value = o.disc ?? String(config.min_discount);
    if (!$("o-disc").value) $("o-disc").value = "50";
    $("o-cost").value = o.cost ?? config.max_ai_cost;
    $("o-sus").checked = o.sus ?? false;
    $("o-shops").checked = o.shops ?? config.shops_default;
    $("o-ceneo").checked = o.ceneo ?? config.ceneo_default;
    $("o-seller").checked = o.seller ?? config.seller_default;
  }
  function saveOptions() {
    store.set("vs-options-v2", { text: $("s-input").value, known: $("o-known").checked, sizes: $("o-sizes").value,
                                 disc: $("o-disc").value, cost: $("o-cost").value, sus: $("o-sus").checked,
                                 shops: $("o-shops").checked, ceneo: $("o-ceneo").checked, seller: $("o-seller").checked });
  }
  optionIds.forEach((id) => $(id).addEventListener("input", () => { saveOptions(); updateEstimate(); }));

  function showAiStatus() {
    const shops = config.shops.length ? `cena regularna ze sklepów (${config.shops.join(", ")}), ` : "";
    const free = `${shops}Ceneo (najniższa cena nowego w sklepach), opis sprzedającego („cena w sklepie…”) i watchlista; ` +
      "gdy żadnego nie ma — mediana podobnych ofert na Vinted.";
    if (config.ai_enabled) {
      $("ai-status").textContent = `Ceny odniesienia: AI (${config.ai_model}) szuka ceny regularnej w sieci, a poza tym ${free} ` +
        "Przy każdej okazji widać źródło.";
    } else {
      $("ai-status").textContent = `Ceny odniesienia (za darmo): ${free} Przy każdej okazji widać źródło. ` +
        "AI jest opcjonalne — README → „Klucz API”.";
      $("o-cost-label").hidden = true;
    }
    $("o-ceneo-label").hidden = !config.ceneo_available;
    $("o-shops-label").hidden = !config.shops.length;
    $("o-shops-label").title = "Cena regularna (sprzed promocji) z: " + config.shops.join(", ") +
      ". Sklepy dopisujesz w watchlist.toml ([[shop]]).";
  }

  const understood = (q) => `„${q.text}” → ${q.scope}`;
  function showStatus(s) {
    const running = s.running;
    $("scan").dataset.running = running ? "1" : "";
    $("scan").disabled = running;
    $("scan").textContent = running ? "Szukam…" : "Szukaj okazji";
    $("stop").hidden = !running;
    $("progress").hidden = !s.total;
    $("bar-fill").style.width = s.total ? `${Math.round(100 * s.done / s.total)}%` : "0";
    const parts = [];
    if (running) parts.push(`${s.done}/${s.total}` + (s.current ? ` · teraz: „${s.current}”` : ""));
    else if (s.finished_at) parts.push(`zakończono ${new Date(s.finished_at).toLocaleTimeString("pl-PL")} · ${s.done}/${s.total} fraz`);
    if (s.total) parts.push(`${s.deals.length} okazji z ${s.listings_seen} ogłoszeń`);
    if (s.ai_cost_usd || s.ai_searches) parts.push(`AI: ${usd(s.ai_cost_usd)}, ${s.ai_searches} wyszukiwań`);
    const lk = s.lookups || {};
    if (lk.sklepy || lk.ceneo || lk.opisy) {
      parts.push(`sklepy: ${lk.sklepy || 0} zapytań · Ceneo: ${lk.ceneo || 0} · opisy: ${lk.opisy || 0}`);
    }
    if (s.funnel) parts.push(`odpadło: ${s.funnel}`);
    $("progress-text").textContent = parts.join(" · ");
    $("understood").textContent = (s.searches || []).map(understood).join(" · ");
    $("scan-errors").textContent = Object.entries(s.errors || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
    $("meta").textContent = s.finished_at || running ? "" : "Wpisz, czego szukasz, i kliknij „Szukaj okazji”. Wyniki pojawiają się na bieżąco.";
    const empty = running ? "Szukam… okazje pojawią się tutaj." : s.total ? "Brak okazji dla wybranych filtrów." : "Jeszcze nic nie wyszukano.";
    setDeals(s.deals, empty);
  }
  async function poll() {
    try {
      const s = await api("/api/status");
      showStatus(s);
      if (!s.running) { clearInterval(polling); polling = null; }
    } catch (e) {
      $("scan-errors").textContent = "Brak połączenia z serwerem — czy vinted-screener serve nadal działa?";
    }
  }
  function startPolling() { if (!polling) polling = setInterval(poll, 1000); }

  $("search-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const list = phrases();
    if (!list.length) {
      $("scan-errors").textContent = "Wpisz, czego szukasz — markę, typ rzeczy albo jedno i drugie.";
      $("s-input").focus();
      return;
    }
    if (list.length > config.max_searches) {
      $("scan-errors").textContent = `Najwyżej ${config.max_searches} fraz naraz.`;
      return;
    }
    const sizes = $("o-sizes").value.replace(/,\s/g, " ").split(/[\s;]+/).filter(Boolean);
    const body = {
      queries: list, only_known_brands: $("o-known").checked, sizes,
      min_discount: Number($("o-disc").value), show_suspicious: $("o-sus").checked,
      shops: $("o-shops").checked, ceneo: $("o-ceneo").checked, seller: $("o-seller").checked,
    };
    if (config.ai_enabled) body.max_ai_cost = Math.min(50, Math.max(0, parseFloat($("o-cost").value) || 0));
    try {
      await api("/api/scan", body);
      remember(list);
      if ($("o-sus").checked) $("sus").checked = true;
      await poll(); startPolling();
    } catch (e) { $("scan-errors").textContent = e.message; }
  });
  $("stop").onclick = () => api("/api/stop", {}).catch((e) => { $("scan-errors").textContent = e.message; });

  (async () => {
    try {
      config = await api("/api/config");
    } catch (e) {
      $("meta").textContent = "Nie udało się połączyć z serwerem: " + e.message;
      return;
    }
    showAiStatus(); loadOptions(); renderRecent(); suggest(); updateEstimate();
    await poll();
    if ($("scan").dataset.running === "1") startPolling();
  })();
}
</script>
</body>
</html>
