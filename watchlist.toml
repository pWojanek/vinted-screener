# ─── Sklepy z cenami regularnymi (wyszukiwarka) ───────────────────────────────
# Screener wpisuje nazwę produktu w wyszukiwarkę sklepu i czyta ceny z danych zapisanych w stronie wyników.
# Bierze cenę regularną (sprzed promocji). Najpierw pyta oficjalny sklep marki, potem sklepy wielomarkowe,
# a dopiero gdy nic nie znajdą — Ceneo. Sklep, który zablokuje zapytania, wyłącza się do końca skanu.
# name       – etykieta przy cenie ("retail wg nike.com")
# search_url – adres wyników wyszukiwania z {q} w miejscu frazy: wyszukaj coś w sklepie, skopiuj adres z paska
#              przeglądarki i podmień wpisaną frazę na {q}
# brands     – (opcjonalnie) oficjalny sklep tylko tych marek; bez tego sklep wielomarkowy, pytany o każdą markę
# currency   – (opcjonalnie) PLN (domyślnie) albo EUR, przeliczane po 4,30 zł
# link_base  – (opcjonalnie) czym zastąpić znacznik typu {countryLang} na początku linków do produktów
# Czy sklep działa: scan --search "nike dunk" --debug pokazuje, ile produktów odczytano z każdego sklepu.

[[shop]]
name = "nike.com"
search_url = "https://www.nike.com/pl/w?q={q}&vst={q}"
brands = ["Nike", "Jordan"]
link_base = "https://www.nike.com/pl"

[[shop]]
name = "adidas.pl"
search_url = "https://www.adidas.pl/search?q={q}"
brands = ["adidas"]

[[shop]]
name = "Zalando"
search_url = "https://www.zalando.pl/katalog/?q={q}"
