# Watchlista screenera okazji na Vinted.
#
# Ceny "retail" to ORIENTACYJNE regularne ceny w PLN (oficjalne sklepy marek, popularne kolorystyki).
# Różnią się między kolorystykami i sezonami — popraw je, jeśli znasz aktualne.
#
# Pola pozycji [[item]]:
#   name             – nazwa wyświetlana w wynikach (unikalna)
#   category         – kategoria do filtrowania (--category)
#   query            – fraza wpisywana w wyszukiwarkę Vinted
#   retail           – cena regularna w PLN
#   brands           – marka ogłoszenia musi być jedną z tych (odsiewa "Inna marka" i podróbki "a'la")
#   require          – frazy, które MUSZĄ być w tytule; "a|b" = a lub b; "xyz*" = dowolna końcówka
#   exclude          – frazy, które wykluczają ogłoszenie (dodatkowo zawsze odrzucane są repliki,
#                      same pudełka, rzeczy dziecięce, zamiany i uszkodzone — patrz watchlist.py)
#   min_discount     – (opcjonalnie) minimalny rabat od retailu w %, nadpisuje [settings]
#   suspicious_below – (opcjonalnie) cena poniżej X% retailu = podejrzana (podróbka/scam); dla mocno
#                      podrabianych marek ustawione wyżej
#   status_ids       – (opcjonalnie) stany: 6 nowy z metką, 1 nowy bez metki, 2 bardzo dobry, 3 dobry, 4 zadowalający

[settings]
domain = "www.vinted.pl"
currency = "PLN"
min_discount = 50          # okazja = co najmniej 50% taniej niż retail (cena + ochrona kupujących)
suspicious_below = 20      # poniżej 20% retailu = podejrzane, domyślnie ukrywane
status_ids = [6, 1, 2]     # tylko nowe i bardzo dobre
sizes = []                 # np. ["42", "42.5", "M"] — filtruje po rozmiarze; puste = wszystkie
pages = 1                  # stron po 96 najnowszych ogłoszeń na model
delay = 1.5                # sekundy między zapytaniami (nie zmniejszaj, Vinted blokuje)
market_ttl_hours = 12      # jak długo trzymać w cache medianę cen z Vinted

